<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>119 실시간 음성 인식</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #e94560;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        #startBtn {
            background: #e94560;
            color: white;
        }
        #startBtn:hover { background: #c73a52; }
        #startBtn:disabled { background: #555; cursor: not-allowed; }
        #stopBtn {
            background: #533483;
            color: white;
        }
        #stopBtn:hover { background: #6a42a0; }
        #stopBtn:disabled { background: #555; cursor: not-allowed; }
        .hotwords-input {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #eee;
            font-size: 0.9rem;
        }
        .status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .status.recording {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            color: #e94560;
            animation: pulse 1.5s infinite;
        }
        .status.idle {
            background: rgba(83, 52, 131, 0.2);
            border: 1px solid #533483;
            color: #a78bfa;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .transcript-box {
            width: 100%;
            max-width: 800px;
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
        }
        .segment {
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border-left: 3px solid #e94560;
        }
        .segment .speaker {
            font-weight: bold;
            color: #e94560;
            font-size: 0.85rem;
        }
        .segment .time {
            color: #888;
            font-size: 0.8rem;
            margin-left: 8px;
        }
        .segment .content {
            margin-top: 4px;
            line-height: 1.5;
        }
        .segment.partial {
            border-left-color: #533483;
            opacity: 0.7;
        }
        .info {
            color: #888;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>119 실시간 음성 인식 (VibeVoice ASR)</h1>

    <div class="hotwords-input">
        <input type="text" id="hotwords"
               placeholder="핫워드 (쉼표 구분): 화재,구급,구조,테헤란로,삼성아파트"
               value="화재,구급,구조,교통사고,서울,부산,대구,인천">
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startRecording()">녹음 시작</button>
        <button id="stopBtn" onclick="stopRecording()" disabled>녹음 중지</button>
    </div>

    <div class="status idle" id="status">대기 중</div>

    <div class="transcript-box" id="transcriptBox">
        <div class="info">녹음을 시작하면 실시간 전사 결과가 여기에 표시됩니다.</div>
    </div>

    <p class="info" style="margin-top: 16px;">
        마이크 입력을 16kHz PCM으로 변환하여 WebSocket으로 전송합니다.
    </p>

    <script>
        let ws = null;
        let mediaStream = null;
        let audioContext = null;
        let processor = null;
        const TARGET_SAMPLE_RATE = 16000;

        function setStatus(text, className) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status ' + className;
        }

        function addSegment(data, isPartial) {
            const box = document.getElementById('transcriptBox');
            // 첫 결과시 안내 문구 제거
            const info = box.querySelector('.info');
            if (info) info.remove();

            // partial이면 기존 partial 제거
            if (isPartial) {
                const prev = box.querySelectorAll('.partial');
                prev.forEach(el => el.remove());
            }

            const segments = data.segments || [];
            if (segments.length === 0 && data.raw_text) {
                segments.push({ Content: data.raw_text });
            }

            segments.forEach(seg => {
                const div = document.createElement('div');
                div.className = 'segment' + (isPartial ? ' partial' : '');

                let html = '';
                if (seg.Speaker !== undefined) {
                    html += `<span class="speaker">화자 ${seg.Speaker}</span>`;
                }
                if (seg.Start !== undefined) {
                    html += `<span class="time">${seg.Start.toFixed(1)}s - ${seg.End.toFixed(1)}s</span>`;
                }
                html += `<div class="content">${seg.Content || seg.text || ''}</div>`;

                div.innerHTML = html;
                box.appendChild(div);
            });

            box.scrollTop = box.scrollHeight;
        }

        async function startRecording() {
            const hotwords = document.getElementById('hotwords').value;
            const wsUrl = `ws://${location.host}/ws/transcribe?sample_rate=${TARGET_SAMPLE_RATE}&buffer_seconds=5&hotwords=${encodeURIComponent(hotwords)}`;

            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                setStatus('녹음 중...', 'recording');
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'error') {
                    console.error('ASR 오류:', data.message);
                    return;
                }
                const isPartial = data.type === 'partial';
                addSegment(data, isPartial);
            };
            ws.onclose = () => {
                setStatus('대기 중', 'idle');
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            };
            ws.onerror = (err) => {
                console.error('WebSocket 오류:', err);
                setStatus('연결 오류', 'idle');
            };

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: TARGET_SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });

                audioContext = new AudioContext({ sampleRate: TARGET_SAMPLE_RATE });
                const source = audioContext.createMediaStreamSource(mediaStream);

                // ScriptProcessorNode로 PCM 데이터 추출
                const bufferSize = 4096;
                processor = audioContext.createScriptProcessor(bufferSize, 1, 1);
                processor.onaudioprocess = (e) => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const float32 = e.inputBuffer.getChannelData(0);
                        // float32 -> int16 PCM
                        const int16 = new Int16Array(float32.length);
                        for (let i = 0; i < float32.length; i++) {
                            const s = Math.max(-1, Math.min(1, float32[i]));
                            int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        ws.send(int16.buffer);
                    }
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

            } catch (err) {
                console.error('마이크 접근 오류:', err);
                setStatus('마이크 접근 불가', 'idle');
                if (ws) ws.close();
            }
        }

        function stopRecording() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'stop' }));
            }
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            setStatus('대기 중', 'idle');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    </script>
</body>
</html>
