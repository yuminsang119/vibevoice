<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>119 ASR 통제 대시보드</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .header {
            background: #161b22;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #30363d;
        }
        .header h1 { font-size: 1.2rem; color: #e94560; }
        .header .status-bar {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
        }
        .stat-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }
        .stat-badge.active { background: rgba(233,69,96,0.2); color: #e94560; }
        .stat-badge.total { background: rgba(88,166,255,0.2); color: #58a6ff; }
        .stat-badge.dispatched { background: rgba(63,185,80,0.2); color: #3fb950; }

        .main { display: flex; height: calc(100vh - 52px); }

        /* 좌측: 세션 목록 */
        .session-list {
            width: 320px;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            background: #0d1117;
        }
        .session-list-header {
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .session-item {
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
            cursor: pointer;
            transition: background 0.15s;
        }
        .session-item:hover { background: #161b22; }
        .session-item.selected { background: #1c2128; border-left: 3px solid #e94560; }
        .session-item .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-item .sid { font-weight: bold; font-size: 0.9rem; }
        .session-item .time { color: #8b949e; font-size: 0.75rem; }
        .session-item .type-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 4px;
            display: inline-block;
        }
        .urgency-1 { background: rgba(248,81,73,0.2); color: #f85149; }
        .urgency-2 { background: rgba(210,153,34,0.2); color: #d29922; }
        .urgency-3 { background: rgba(88,166,255,0.2); color: #58a6ff; }

        /* 우측: 세션 상세 */
        .detail-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .detail-header {
            padding: 16px 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .detail-header h2 { font-size: 1rem; }
        .detail-header .actions { display: flex; gap: 8px; }
        .detail-header button {
            padding: 6px 16px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .detail-header button.dispatch-btn {
            background: #e94560;
            border-color: #e94560;
            color: white;
        }
        .detail-header button:hover { opacity: 0.85; }

        .detail-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-content: start;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
        }
        .card.full-width { grid-column: 1 / -1; }
        .card h3 {
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .urgency-display {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
        }
        .urgency-display.level-1 { background: rgba(248,81,73,0.15); color: #f85149; }
        .urgency-display.level-2 { background: rgba(210,153,34,0.15); color: #d29922; }
        .urgency-display.level-3 { background: rgba(88,166,255,0.15); color: #58a6ff; }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
            font-size: 0.85rem;
        }
        .info-row .label { color: #8b949e; }

        .patient-item {
            padding: 8px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .symptom-tag {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px;
            background: rgba(248,81,73,0.15);
            border-radius: 4px;
            font-size: 0.75rem;
            color: #f85149;
        }

        .vehicle-tag {
            display: inline-block;
            padding: 4px 10px;
            margin: 3px;
            background: rgba(63,185,80,0.15);
            border: 1px solid rgba(63,185,80,0.3);
            border-radius: 6px;
            font-size: 0.85rem;
            color: #3fb950;
        }

        .instruction-item {
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
            font-size: 0.85rem;
        }
        .instruction-item.critical {
            color: #f85149;
            font-weight: bold;
        }

        .transcript-line {
            padding: 4px 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .transcript-line .speaker { color: #e94560; font-weight: bold; }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #484f58;
            font-size: 0.9rem;
        }

        .map-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 2px 8px;
            border: 1px solid #30363d;
            border-radius: 4px;
            margin-right: 6px;
        }
        .map-links a:hover { background: #21262d; }

        /* 테스트 입력 */
        .test-panel {
            padding: 16px 20px;
            background: #161b22;
            border-top: 1px solid #30363d;
        }
        .test-panel textarea {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 0.85rem;
            resize: vertical;
            min-height: 60px;
        }
        .test-panel .test-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>119 ASR 통제 대시보드</h1>
        <div class="status-bar">
            <span class="stat-badge active" id="statActive">활성 0</span>
            <span class="stat-badge dispatched" id="statDispatched">출동 0</span>
            <span class="stat-badge total" id="statTotal">전체 0</span>
        </div>
    </div>

    <div class="main">
        <div class="session-list">
            <div class="session-list-header">
                <span>통화 세션</span>
                <button onclick="createTestSession()" style="padding:4px 8px;background:#21262d;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;cursor:pointer;font-size:0.75rem;">테스트 세션</button>
            </div>
            <div id="sessionListBody"></div>
        </div>

        <div class="detail-panel">
            <div id="detailContent">
                <div class="empty-state">세션을 선택하세요</div>
            </div>

            <div class="test-panel">
                <textarea id="testInput" placeholder="테스트 텍스트 입력: 서울 강남구 테헤란로 152에서 화재 발생, 50대 남성 의식 없음"></textarea>
                <div class="test-actions">
                    <button onclick="analyzeText()" style="padding:6px 12px;background:#e94560;border:none;border-radius:6px;color:white;cursor:pointer;font-size:0.85rem;">분석</button>
                    <button onclick="clearResult()" style="padding:6px 12px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:0.85rem;">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedSession = null;

        async function fetchStats() {
            try {
                const resp = await fetch('/api/control/stats');
                const data = await resp.json();
                document.getElementById('statActive').textContent = `활성 ${data.active_calls}`;
                document.getElementById('statDispatched').textContent = `출동 ${data.dispatched}`;
                document.getElementById('statTotal').textContent = `전체 ${data.total_calls}`;
            } catch(e) {}
        }

        async function fetchSessions() {
            try {
                const resp = await fetch('/api/control/sessions');
                const data = await resp.json();
                renderSessionList(data.sessions || []);
            } catch(e) {}
        }

        function renderSessionList(sessions) {
            const body = document.getElementById('sessionListBody');
            body.innerHTML = '';
            sessions.sort((a, b) => b.started_at.localeCompare(a.started_at));
            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item' + (selectedSession === s.session_id ? ' selected' : '');
                div.onclick = () => selectSession(s.session_id);

                const urgLevel = s.urgency ? s.urgency.level : 3;
                const urgLabel = s.urgency ? s.urgency.label : '대기';
                const rType = s.report_type ? s.report_type.type : '분석중';

                div.innerHTML = `
                    <div class="top-row">
                        <span class="sid">${s.session_id}</span>
                        <span class="time">${s.started_at.split(' ')[1] || s.started_at}</span>
                    </div>
                    <span class="type-badge urgency-${urgLevel}">${urgLabel} / ${rType}</span>
                    <span style="color:#8b949e;font-size:0.75rem;margin-left:6px;">${s.status}</span>
                `;
                body.appendChild(div);
            });
        }

        async function selectSession(sid) {
            selectedSession = sid;
            fetchSessions();
            try {
                const resp = await fetch(`/api/control/session/${sid}`);
                const data = await resp.json();
                renderDetail(data);
            } catch(e) {}
        }

        function renderDetail(s) {
            const el = document.getElementById('detailContent');
            if (s.status === 'not_found') {
                el.innerHTML = '<div class="empty-state">세션을 찾을 수 없습니다</div>';
                return;
            }

            const urgLevel = s.urgency ? s.urgency.level : 3;
            const urgLabel = s.urgency ? s.urgency.label : '대기';
            const urgReason = s.urgency ? s.urgency.reason : '';

            const rType = s.report_type ? s.report_type.type : '분석중';

            let patientsHtml = '';
            (s.patients || []).forEach(p => {
                let sympHtml = (p.symptoms || []).map(sy => `<span class="symptom-tag">${sy}</span>`).join('');
                patientsHtml += `<div class="patient-item">${p.index}번 환자: ${p.gender} ${p.age} ${sympHtml}</div>`;
            });

            let locationHtml = '주소 미확인';
            let mapLinksHtml = '';
            if (s.locations && s.locations.length > 0) {
                const loc = s.locations[0];
                const addr = loc.extracted ? loc.extracted.full : '';
                const geo = loc.geocode;
                locationHtml = addr;
                if (geo && geo.latitude) {
                    locationHtml += `<br><span style="color:#8b949e;font-size:0.8rem;">${geo.latitude.toFixed(6)}, ${geo.longitude.toFixed(6)}</span>`;
                }
                const urls = loc.map_urls || {};
                if (urls.kakao) mapLinksHtml += `<a href="${urls.kakao}" target="_blank">카카오</a>`;
                if (urls.naver) mapLinksHtml += `<a href="${urls.naver}" target="_blank">네이버</a>`;
                if (urls.google) mapLinksHtml += `<a href="${urls.google}" target="_blank">구글</a>`;
            }

            let dispatchHtml = '';
            if (s.dispatch_order) {
                const d = s.dispatch_order;
                let vehHtml = (d.vehicles || []).map(v => `<span class="vehicle-tag">${v}</span>`).join('');
                let instrHtml = (d.instructions || []).map(i =>
                    `<div class="instruction-item ${i.startsWith('***') ? 'critical' : ''}">${i}</div>`
                ).join('');
                dispatchHtml = `
                    <div class="card full-width">
                        <h3>출동 지령서 [${d.dispatch_id}]</h3>
                        <div class="info-row"><span class="label">출동 차량</span></div>
                        <div style="margin:8px 0">${vehHtml}</div>
                        <div class="info-row"><span class="label">지시사항</span></div>
                        ${instrHtml}
                    </div>
                `;
            }

            el.innerHTML = `
                <div class="detail-header">
                    <h2>세션 ${s.session_id}</h2>
                    <div class="actions">
                        <button onclick="dispatchSession('${s.session_id}')" class="dispatch-btn">출동 지령</button>
                        <button onclick="closeSession('${s.session_id}')">세션 종료</button>
                    </div>
                </div>
                <div class="detail-body">
                    <div class="card">
                        <h3>긴급도</h3>
                        <div class="urgency-display level-${urgLevel}">${urgLabel}</div>
                        <div style="text-align:center;margin-top:8px;font-size:0.8rem;color:#8b949e;">${urgReason}</div>
                    </div>
                    <div class="card">
                        <h3>신고 유형</h3>
                        <div class="urgency-display level-${urgLevel === 1 ? 1 : 2}">${rType}</div>
                    </div>
                    <div class="card">
                        <h3>위치</h3>
                        <div style="font-size:0.9rem;line-height:1.6;">${locationHtml}</div>
                        <div class="map-links" style="margin-top:8px;">${mapLinksHtml}</div>
                    </div>
                    <div class="card">
                        <h3>환자/피해자</h3>
                        ${patientsHtml || '<div style="color:#8b949e;font-size:0.85rem;">정보 없음</div>'}
                    </div>
                    ${dispatchHtml}
                </div>
            `;
        }

        async function dispatchSession(sid) {
            const resp = await fetch(`/api/control/session/${sid}/dispatch`, { method: 'POST' });
            const data = await resp.json();
            if (data.status === 'ok') {
                selectSession(sid);
                fetchStats();
            }
        }

        async function closeSession(sid) {
            await fetch(`/api/control/session/${sid}/close`, { method: 'POST' });
            fetchSessions();
            fetchStats();
        }

        async function createTestSession() {
            const resp = await fetch('/api/control/session', { method: 'POST' });
            const data = await resp.json();
            fetchSessions();
            fetchStats();
            if (data.session_id) selectSession(data.session_id);
        }

        async function analyzeText() {
            const text = document.getElementById('testInput').value;
            if (!text.trim()) return;

            const resp = await fetch('/api/control/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });
            const data = await resp.json();

            // 결과를 임시 세션처럼 표시
            renderDetail({
                session_id: 'test',
                status: 'test',
                urgency: data.urgency,
                report_type: data.report_type,
                patients: data.patients,
                locations: data.locations,
            });
        }

        function clearResult() {
            document.getElementById('testInput').value = '';
            document.getElementById('detailContent').innerHTML = '<div class="empty-state">세션을 선택하세요</div>';
        }

        // 주기적 갱신
        fetchStats();
        fetchSessions();
        setInterval(() => { fetchStats(); fetchSessions(); }, 3000);
    </script>
</body>
</html>
